name: rembo
description: "Expense reports for small and medium-sized businesses in Morocco."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  crypto: ^3.0.6
  shared_preferences: ^2.3.0
  google_mlkit_text_recognition: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Charter fonts, variable files under the SIL Open Font License
  # (see assets/fonts/*_OFL.txt).
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo.ttf
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/instrumentsans.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrainsmono.ttf
