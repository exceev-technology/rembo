name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyze-test:
    # Required status check on main: keep this name in sync with the ruleset.
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: No server-only key in the repository (control C5)
        run: tool/check_no_secrets.sh

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  build-android:
    name: Build Android
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: No server-only key in the app (control C5)
        run: tool/check_no_secrets.sh build/app/outputs/flutter-apk/app-debug.apk

  database:
    name: Database & functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Migrations, security rules and SQL functions (pgTAP), on a local
      # stack started in Docker: nothing reaches a real project.
      - name: SQL tests (pgTAP)
        run: |
          npx --yes supabase@3.1.0 start -x studio,imgproxy,logflare,vector,realtime,edge-runtime,mailpit,postgres-meta,supavisor
          npx --yes supabase@3.1.0 test db
          npx --yes supabase@3.1.0 stop --no-backup

      - name: Edge Function tests (Deno)
        run: >-
          docker run --rm -v "$PWD/supabase/functions:/f" -w /f
          denoland/deno:2.5.6 test --allow-env read-receipt/

  journey:
    name: End-to-end journey
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install the desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev \
            gnome-keyring dbus-x11 xvfb

      - name: Install dependencies
        run: flutter pub get

      # Capture, correction, submission and decision, with the data kept on
      # the device: the same test runs on a phone and on an iOS simulator.
      - name: Journey (desktop, virtual screen)
        # The data kept on the device is encrypted with a key held by the
        # system keyring (flutter_secure_storage): start one for the test.
        run: >-
          dbus-run-session -- bash -c
          'echo test | gnome-keyring-daemon --unlock --components=secrets &&
          xvfb-run -a flutter test integration_test/journey_test.dart -d linux'

  build-ios:
    name: Build iOS
    needs: analyze-test
    # macOS runners are slower: build iOS on main and on demand, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --debug --no-codesign

      # Best effort until a run is green: Google ML Kit may not provide
      # every simulator architecture. The build above is the required check.
      - name: Journey on an iPhone simulator
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d for x in d[r] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          flutter test integration_test/journey_test.dart -d "$UDID"
