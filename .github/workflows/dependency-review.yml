name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities
# or licenses incompatible with MIT.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          # Packages whose license is fine but reported as a non-SPDX id, which fails the check.
          # Verify the license by hand before adding one. cupertino_icons: MIT, reported as "mit".
          # Checked 2026-11-23 in each package's LICENSE: dbus is MPL-2.0, all the others MIT
          # (file_picker and its platform packages, pdfx, petitparser, synchronized, xml).
          allow-dependencies-licenses: >-
            pkg:pub/cupertino_icons, pkg:pub/android_file_picker, pkg:pub/dbus, pkg:pub/file_picker, pkg:pub/file_picker_darwin, pkg:pub/file_picker_linux, pkg:pub/file_picker_platform_interface, pkg:pub/file_picker_web, pkg:pub/pdfx, pkg:pub/petitparser, pkg:pub/synchronized, pkg:pub/windows_file_picker, pkg:pub/xml
          comment-summary-in-pr: on-failure
