name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities
# or licenses incompatible with MIT.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          # Packages whose license is fine but reported as a non-SPDX id, which fails the check.
          # Verify the license by hand before adding one. cupertino_icons: MIT, reported as "mit".
          allow-dependencies-licenses: pkg:pub/cupertino_icons
          comment-summary-in-pr: on-failure
