name: Welcome

# Greets people on their first issue or pull request in this repository.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            👋 Thanks for opening your first issue in Rembo! The team triages new issues during Sprint Planning (Mondays).
            While you wait, have a look at the [wiki](https://github.com/exceev-technology/rembo/wiki) and our [Code of Conduct](https://github.com/exceev-technology/rembo/blob/main/CODE_OF_CONDUCT.md).
          pr_message: |
            🎉 Thanks for your first pull request to Rembo!
            A teammate will review it soon. In the meantime, please check that:
            - the PR title follows [Conventional Commits](https://www.conventionalcommits.org/) (checked by CI)
            - the PR links its issue with `Closes #…`
            - `dart format .`, `flutter analyze` and `flutter test` pass locally

            The full guide is in [CONTRIBUTING.md](https://github.com/exceev-technology/rembo/blob/main/CONTRIBUTING.md).
