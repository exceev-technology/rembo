name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          # Anything planned in a sprint (milestone) or explicitly kept is never stale.
          exempt-all-milestones: true
          exempt-issue-labels: "priority: critical,priority: high,status: blocked,epic,good first issue,help wanted"
          exempt-pr-labels: "status: blocked"
          exempt-draft-pr: true
          close-issue-reason: not_planned
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days
            unless there is new activity. If it still matters, leave a comment. Thank you! 🙏
          close-issue-message: >
            Closing this issue after 74 days without activity. Feel free to reopen it with
            new information.
          stale-pr-message: >
            This pull request has had no activity for 14 days. It will be closed in 7 days
            unless it is updated. Need help to finish it? Ask in the comments.
          close-pr-message: >
            Closing this pull request after 21 days without activity. You can reopen it at any time.
