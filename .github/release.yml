# Categories for automatically generated release notes.
# Docs: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels: ["skip changelog", duplicate, invalid, wontfix]
  categories:
    - title: 💥 Breaking changes
      labels: ["breaking change"]
    - title: ✨ Features
      labels: ["type: feature"]
    - title: 🐛 Bug fixes
      labels: ["type: bug"]
    - title: 🔒 Security
      labels: ["type: security"]
    - title: 📚 Documentation
      labels: ["type: docs"]
    - title: ⬆️ Dependencies
      labels: [dependencies]
    - title: 🧰 Maintenance
      labels: ["*"]
